name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    # Cơ sở dữ liệu cho kiểm thử tích hợp. Tên kết thúc bằng _test là chốt chặn an toàn của bộ kiểm thử.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kgs_booking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kgs_booking_test?schema=public
      AUTH_SECRET: ci-only-secret
      APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npx prisma generate

      - name: Kiểm tra kiểu (TypeScript)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Kiểm thử tự động
        run: npm test

      # Build không cần kết nối cơ sở dữ liệu: trỏ vào địa chỉ không tồn tại để chứng minh điều đó.
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://nobody:nopass@127.0.0.1:1/none?schema=public&connect_timeout=2
