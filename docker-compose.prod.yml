# Triển khai thật trên một máy chủ (VPS): cơ sở dữ liệu + migration + ứng dụng.
# Cách dùng (xem README, mục "Triển khai"):
#   cp .env.prod.example .env.prod        # rồi điền giá trị thật
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
# Cổng 3000 chỉ mở trên 127.0.0.1: đặt Caddy/Nginx phía trước để có HTTPS (xem deploy/Caddyfile).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kgs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Hãy đặt POSTGRES_PASSWORD trong .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-kgs_booking}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kgs} -d ${POSTGRES_DB:-kgs_booking}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Không công bố cổng 5432 ra ngoài: chỉ ứng dụng trong cùng mạng Docker mới truy cập được.

  migrate:
    build:
      context: ./web
      target: migrator
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kgs}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-kgs_booking}?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: ./web
      target: runner
    restart: unless-stopped
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kgs}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-kgs_booking}?schema=public
      AUTH_TRUST_HOST: "true"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Gọi định kỳ (5 phút/lần) để hủy các đơn chờ thanh toán đã quá hạn giữ phòng. Gọi thẳng vào ứng dụng trong mạng Docker,
  # không đi qua proxy ngoài. Cần CRON_SECRET trong .env.prod (cùng giá trị ứng dụng đọc).
  cron:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    env_file: .env.prod
    depends_on:
      web:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          sleep 300
          curl -fsS -m 30 -X POST -H "Authorization: Bearer $$CRON_SECRET" http://web:3000/api/cron/expire-bookings || echo "cron: gọi thất bại"
        done

volumes:
  pgdata:
  uploads:
